{% extends "crm/base.html" %}
{% block title %}Delete — Control Center{% endblock %}
{% block page_title %}Delete{% endblock %}
{% block content %}

<div class="dash-card form-card">
  <p style="margin-bottom:1.4rem">Are you sure you want to delete <b>{{ object }}</b>? This can't be undone.</p>
  <form method="post" class="form-actions">
    {% csrf_token %}
    <button type="submit" class="btn btn--danger">Yes, delete it</button>
    {% if back_url %}<a href="{% url back_url %}" class="btn btn--ghost">Cancel</a>{% endif %}
  </form>
</div>

{% endblock %}
